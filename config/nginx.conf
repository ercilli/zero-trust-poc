events { worker_connections 1024; }

http {
    server {
        listen 443 ssl;
        server_name proxy-servicio-b;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Se fija TLS 1.2: con TLS 1.3 algunos clientes/servidores abortan el
        # handshake ante la ausencia de certificado en vez de completar la
        # negociación y devolver un 400 HTTP a nivel de aplicación.
        ssl_protocols TLSv1.2;

        # Configuración mTLS
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;

        # Logs con estado de verificación SSL
        error_log /var/log/nginx/error.log warn;
        access_log /var/log/nginx/access.log combined;

        location / {
            proxy_pass http://payments-api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Verify $ssl_client_verify;
        }
    }
}